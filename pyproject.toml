[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "genesis-quest-teleop"
version = "0.1.0"
description = "Low-latency Meta Quest teleoperation backend for Genesis World"
requires-python = ">=3.11,<3.12"
dependencies = ["torch", "genesis-world[usd]", "aiortc", "aiohttp", "numpy", "scipy", "PyYAML", "gs-nyx-plugin", "imgui-bundle"]

[project.scripts]
genesis-quest-teleop = "genesis_quest_teleop.main:main"
genesis-quest-ingress = "genesis_quest_teleop.ingress:main"
genesis-quest-calibrate-wrist-camera = "genesis_quest_teleop.calibrate_wrist_camera:main"
genesis-quest-place-scene = "genesis_quest_teleop.place_scene:main"
genesis-quest-import-usd = "genesis_quest_teleop.import_usd_scene:main"
genesis-quest-repair-usd-materials = "genesis_quest_teleop.repair_usd_materials:main"

[dependency-groups]
dev = ["ruff"]

[tool.uv.sources]
torch = { index = "pytorch-cu128" }
genesis-world = { path = "../genesis-world", editable = true }

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff.lint]
ignore = ["TRY004", "BLE001", "LOG015"]
